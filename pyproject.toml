[build-system]
requires = ["uv-build<0.12"]
build-backend = "uv_build"

[project]
name = "cml-mcp"
version = "0.32.2"
license = "BSD-2-Clause AND LicenseRef-Proprietary"
license-files = ["LICENSE", "CISCO_LICENSE.md"]
authors = [{ name = "Joe Clarke", email = "jclarke@cisco.com" }]
description = "Cisco Modeling Labs CML MCP Server"
requires-python = ">=3.12,<3.16"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx2>=2.14,<3",
    "fastmcp>=3.4.11,<4",
    "fastapi",
    "pydantic_strict_partial",
    "typer",
]
optional-dependencies = { "opentelemetry" = [
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
] }

[project.scripts]
cml-mcp = "cml_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/xorrkaz/cml-mcp"
Issues = "https://github.com/xorrkaz/cml-mcp/issues"

[tool.black]
line-length = 140
force-exclude = '''
^/src/cml_mcp/cml/
'''

[tool.isort]
profile = "black"
line_length = 140
skip_glob = ["src/cml_mcp/cml/**"]

[tool.uv.sources]
cml-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    # FastMCP's Streamable HTTP test transport still imports the original package.
    "httpx",
    "inline-snapshot[black]",
    "black",
    "isort",
    "flake8",
    "pre-commit",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Enable this for debugging, but it will make the output very verbose
log_cli = false
